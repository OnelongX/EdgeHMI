<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14"/>
      <stop offset="55%" stop-color="#0b1526"/>
      <stop offset="100%" stop-color="#091d2c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="17" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Left decorative industrial HMI chip & gauge emblem -->
  <g transform="translate(70, 68)">
    <rect x="0" y="0" width="184" height="184" rx="22" fill="#0f172a" stroke="#1e3a5f" stroke-width="2"/>
    <rect x="12" y="12" width="160" height="160" rx="14" fill="#08101e" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Circular industrial gauge -->
    <circle cx="92" cy="86" r="46" fill="none" stroke="#1e293b" stroke-width="10" stroke-dasharray="216 289" stroke-linecap="round" transform="rotate(135 92 86)"/>
    <circle cx="92" cy="86" r="46" fill="none" stroke="url(#accent)" stroke-width="10" stroke-dasharray="165 289" stroke-linecap="round" transform="rotate(135 92 86)"/>
    <text x="92" y="92" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, -apple-system, sans-serif" font-size="22" font-weight="700">60 Hz</text>
    <!-- Mini live bars -->
    <rect x="30" y="144" width="124" height="10" rx="5" fill="#1e293b"/>
    <rect x="30" y="144" width="92" height="10" rx="5" fill="url(#accent)"/>
    <!-- Chip pins -->
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <line x1="-10" y1="44" x2="0" y2="44"/><line x1="-10" y1="74" x2="0" y2="74"/><line x1="-10" y1="104" x2="0" y2="104"/><line x1="-10" y1="134" x2="0" y2="134"/>
      <line x1="184" y1="44" x2="194" y2="44"/><line x1="184" y1="74" x2="194" y2="74"/><line x1="184" y1="104" x2="194" y2="104"/><line x1="184" y1="134" x2="194" y2="134"/>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(296, 86)">
    <rect x="0" y="-26" width="242" height="26" rx="13" fill="#0c2a3e" stroke="#0ea5e9" stroke-width="1"/>
    <text x="121" y="-9" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">ESP32-S3 INDUSTRIAL HMI ENGINE</text>

    <text x="0" y="42" fill="#f8fafc" font-family="Segoe UI, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.5">Edge<tspan fill="url(#accent)">HMI</tspan></text>
    <text x="0" y="80" fill="#cbd5e1" font-family="Segoe UI, -apple-system, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500">原生 C11 确定性工控底座 · LVGL 9 动态组态 · 边缘安全联锁 · 双模 OTA</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 108)" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" font-weight="600">
      <rect x="0" y="0" width="152" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="18" cy="16" r="4" fill="#2dd4bf"/>
      <text x="30" y="21" fill="#e2e8f0">Pure C11 · Zero GC</text>

      <rect x="166" y="0" width="188" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="184" cy="16" r="4" fill="#38bdf8"/>
      <text x="196" y="21" fill="#e2e8f0">Dual-Core FreeRTOS</text>

      <rect x="368" y="0" width="206" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="386" cy="16" r="4" fill="#f59e0b"/>
      <text x="398" y="21" fill="#e2e8f0">Modbus RTU Block Read</text>

      <rect x="588" y="0" width="212" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="606" cy="16" r="4" fill="#10b981"/>
      <text x="618" y="21" fill="#e2e8f0">Dual-Mode OTA + Discovery</text>
    </g>
  </g>
</svg>
